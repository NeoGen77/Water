name: waterstock
description: "Gestion de dépôt d'eau - stock, caisse, clients et rapports."

publish_to: 'none'

version: 4.0.0+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite_common_ffi: ^2.3.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.5
  crypto: ^3.0.5
  intl: ^0.20.2
  fl_chart: ^0.69.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/Letter.png
    - assets/Tampon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Letter.png"
